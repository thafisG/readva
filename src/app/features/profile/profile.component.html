<div class="profile-page">
  <main class="profile-content">
    <app-profile-header />
    @let stats = profileStatistics.statistics();
    <app-stats-overview [stats]="stats" />
    <section class="insights-grid">
      <app-weekly-reading-chart [stats]="stats" />
      <app-reading-goals [stats]="stats" />
      <app-category-breakdown [categories]="stats.categories" />
      <app-recent-achievements />
    </section>
  </main>
</div>
