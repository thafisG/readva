@if (spotlightVisible()) {
  <div class="moka-spotlight" [ngClass]="'spotlight-' + spotlightConfig().theme" role="status">
    <div class="spotlight-decorations" aria-hidden="true">
      <span>✦</span><span>●</span><span>★</span><span>✦</span><span>●</span>
    </div>
    <section class="spotlight-card">
      <button
        class="spotlight-close"
        (click)="dismissSpotlight()"
        aria-label="Fechar mensagem da Moka"
      >
        ✕
      </button>
      <div class="spotlight-art" [class.celebrating]="isCelebrating()">
        <div class="spotlight-halo"></div>
        <img [src]="spotlightConfig().image" [alt]="spotlightConfig().title" />
      </div>
      <div class="spotlight-copy">
        <span class="spotlight-badge"
          >{{ spotlightConfig().emoji }} {{ spotlightConfig().badge }}</span
        >
        <h2>{{ spotlightConfig().title }}</h2>
        <p>{{ spotlightConfig().message }}</p>
        <button class="spotlight-action" (click)="dismissSpotlight()">
          Continuar minha jornada
        </button>
      </div>
    </section>
  </div>
}

@if (visible()) {
  <div
    class="moka-floating visible"
    [class.dragging]="dragging()"
    [style.--moka-drag-x]="dragOffsetX() + 'px'"
  >
    <div class="moka-bubble-wrap" [class.visible]="showBubble()">
      <div class="moka-bubble" [ngClass]="'theme-' + config().theme">
        <button class="bubble-close" (click)="dismiss()" aria-label="Fechar mensagem da Moka">
          ✕
        </button>
        <span class="bubble-emoji">{{ config().emoji }}</span>
        <h4 class="moka-title">{{ config().title }}</h4>
        <p class="moka-message">{{ config().message }}</p>
      </div>
    </div>

    <button
      class="moka-btn"
      [class.wiggle]="isWiggling()"
      (click)="handleCompanionClick()"
      (dblclick)="hideCompanion()"
      (pointerdown)="startCompanionDrag($event)"
      (pointermove)="moveCompanionDrag($event)"
      (pointerup)="finishCompanionDrag($event)"
      (pointercancel)="cancelCompanionDrag()"
      (keydown.escape)="hideCompanion()"
      [attr.aria-label]="
        'Ouvir a Moka: ' +
        config().title +
        '. Arraste para o lado ou clique duas vezes para ocultar.'
      "
      [attr.aria-expanded]="showBubble()"
      title="Arraste para o lado ou clique duas vezes para ocultar"
    >
      <div class="moka-avatar">
        <span class="presence-dot" aria-hidden="true"></span>
        <img [src]="config().image" [alt]="config().title" class="moka-img" />
        <span class="xp-badge" [ngClass]="'badge-' + config().theme">
          {{ config().badge }}
        </span>
      </div>
    </button>
  </div>
}
