spring:
  application:
    name: Readva API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

readva:
  web:
    allowed-origin: ${READVA_WEB_ORIGIN:http://localhost:4200}
