spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: readva
  flyway:
    default-schema: readva
    schemas: readva
    create-schemas: true
  h2:
    console:
      enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true
