name: Readva CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: readva-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting of changed files
        shell: bash
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="$PUSH_BASE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No previous commit is available; skipping the incremental format check."
            exit 0
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMRT "$base...$GITHUB_SHA" |
              grep -E '\.(css|html|js|json|md|scss|ts|tsx|yaml|yml)$' || true
          )

          if (( ${#files[@]} == 0 )); then
            echo "No supported files changed."
            exit 0
          fi

          npx prettier --check --ignore-unknown "${files[@]}"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: bash backend/mvnw -B -f backend/pom.xml test

  e2e:
    name: End-to-end journeys
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E journeys
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
